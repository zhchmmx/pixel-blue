# ISO configuration for the bootc-generic-iso artifact.
#
# image-builder reads this file from /usr/lib/image-builder/bootc/iso.yaml
# inside the container (build.sh installs it there). It is the same
# "container-native ISO contract v0.1.0" that titanoboa implemented, so the
# schema is unchanged: label, plus grub2 default/timeout/entries.
#
# label is the ISO volume label and must stay in sync with the
# root=live:CDLABEL= arguments below. Contract limits: 32 characters max, no
# spaces. Changing it changes the ISO's volume name, nothing else.
#
# enforcing=0 is load-bearing: the squashfs image-builder produces is not
# SELinux-labelled, so the live root cannot be enforced.
label: PixelBlue-Live
grub2:
  default: 0
  timeout: 15
  entries:
    - name: "Pixel Blue Live"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=PixelBlue-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Pixel Blue Live (Basic Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=PixelBlue-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
