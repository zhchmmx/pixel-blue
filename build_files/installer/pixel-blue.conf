# Anaconda profile for the Pixel Blue installer.
#
# A variant of fedora-silverblue -- same UI, same hidden spokes, inherited
# through base_profile -- with one delta: automatic partitioning creates only
# the root subvolume.
#
# Why drop /var and /home: the Silverblue profile asks for them as btrfs
# subvolumes, and that combination breaks a bootc install. bootc deploys the
# system as an ostree tree under /ostree/deploy/<stateroot>/, writes an fstab
# that references only /boot, and serves /var from
# ostree/deploy/<stateroot>/var. The subvolumes end up unreferenced -- but
# PrepareBootcMountTargetsTask (rpm_ostree/installation.py) sees /var in the
# mount-point plan, takes its "bind the mounted /var" branch, and runs
#   mount --bind /mnt/sysimage/var /var/mnt/sysroot/var
# against a subvolume that was never mounted there. The bind fails with
# "special device /mnt/sysimage/var does not exist" after bootc has already
# finished deploying. With no /var mount point planned, the same task takes
# its other branch and binds the stateroot var, which does exist.
#
# Detected via VARIANT_ID=pixel-blue, which no upstream profile matches, so
# there is no ambiguity about which profile wins.

[Profile]
profile_id = pixel-blue
base_profile = fedora-silverblue

[Profile Detection]
os_id = fedora
variant_id = pixel-blue

[Storage]
default_partitioning =
    /        (min 1 GiB, max 70 GiB)
