# Anaconda profile for the Pixel Blue installer.
#
# A variant of fedora-silverblue that currently changes nothing: the UI, the
# hidden spokes, the partitioning plan and the stylesheet all come from
# fedora-silverblue through base_profile, and this file exists to be the place
# where Pixel Blue differs once it needs to. The variant anchor is worth keeping
# because a rebranding override (the custom stylesheet below) hangs off it.
#
# It used to override [Storage] default_partitioning to drop the /var and /home
# btrfs subvolumes: a *bootc* install with them died in
# PrepareBootcMountTargetsTask with "special device /mnt/sysimage/var does not
# exist". The install now goes through ostreecontainer, where the Silverblue
# partitioning plan is what Fedora has shipped for years, so that workaround is
# gone rather than carried forward.
#
# Detected via VARIANT_ID=pixel-blue, which no upstream profile matches, so
# there is no ambiguity about which profile wins.

[Profile]
profile_id = pixel-blue
base_profile = fedora-silverblue

[Profile Detection]
os_id = fedora
variant_id = pixel-blue

# Rebrand the installer without touching anaconda's own stylesheet. Anaconda
# loads this at STYLE_PROVIDER_PRIORITY_APPLICATION + 15, i.e. after its
# anaconda-gtk.css, so the colours it redefines win. See the file for why the
# palette is #3584e4 / #2f63a9.
[User Interface]
custom_stylesheet = /usr/share/pixel-blue/pixel-blue.css
