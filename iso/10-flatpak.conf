# Flatpak remote for the *installed* system.
#
# Anaconda deploys the apps out of the local repo at /flatpak/repo with GPG
# verification off, then reads this key to add a real remote and repoint every
# installed ref at it (InstallFlatpaksTask -> add_remote ->
# replace_installed_refs_remote -> remove_remote("Anaconda")).
#
# Untouched, Anaconda's own default applies -- "fedora
# oci+https://registry.fedoraproject.org" -- and every preinstalled app and
# runtime ends up with origin=fedora, so `flatpak update` follows the Fedora OCI
# registry and the flathub remote the payload registers on first boot is left
# unused. Hence this override.
#
# Format, per pyanaconda's data/anaconda.conf:
#     remote-name  remote-flatpak-repository
#
# The URL is Flathub's repository URL, i.e. the URL= field of
# https://flathub.org/repo/flathub.flatpakrepo (NOT the .flatpakrepo URL
# itself): Anaconda takes this literally and does not fetch the descriptor.

[Payload]
flatpak_remote =
    flathub  https://dl.flathub.org/repo/
