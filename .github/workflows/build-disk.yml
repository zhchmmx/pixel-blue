---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-qcow2-to-s3:
        description: "Upload the qcow2 image to S3"
        required: false
        default: false
        type: boolean
      upload-iso-to-s3:
        description: "Upload the Anaconda ISO to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - testing
    paths:
      - 'Containerfile.iso'
      - 'build_files/iso/**'
      - 'disk_config/disk.toml'
      - 'flatpak_refs/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  IMAGE_BUILDER_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # qcow2 disk image, built with bootc-image-builder (amd64)
  build-qcow2:
    name: Build qcow2
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build qcow2
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/disk.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True
          rootfs: btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-qcow2-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true


      - name: Upload qcow2 to S3
        if: inputs.upload-qcow2-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ vars.S3_BUCKET_NAME }}

  # Live install ISO, built with osbuild image-builder (generic-iso).
  # The ISO boots a GNOME live session; Anaconda installs the container image
  # from a containers-storage copy embedded in the ISO (offline), copies the
  # Flatpak apps from flatpak_refs/ into the target and records the signed
  # GHCR image as the installed deployment's origin. The live/installer
  # environment is a second image built from Containerfile.iso and is never
  # pushed.
  build-iso:
    name: Build live ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build live ISO layer
        run: |
          set -euxo pipefail
          BASE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          # The layer's build installs Flatpaks, whose bwrap sandbox needs
          # the extra capabilities and unconfined labels.
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg PAYLOAD_IMAGE="${BASE_IMAGE}" \
            --tag "localhost/${IMAGE_NAME}-iso:${DEFAULT_TAG}" \
            --file Containerfile.iso .

      - name: Dump image-builder manifest (debug)
        run: |
          set -euxo pipefail
          BASE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          # Dump the exact osbuild pipeline the CLI assembles for this
          # invocation. Cheap (no image work) and it pinpoints which stages
          # write the installer payload store and under which names,
          # something the squashfs census alone kept leaving ambiguous.
          mkdir -p _ib_manifest
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            manifest generic-iso \
            --bootc-default-fs btrfs \
            --bootc-ref "localhost/${IMAGE_NAME}-iso:${DEFAULT_TAG}" \
            --bootc-installer-payload-ref "${BASE_IMAGE}" \
            | sudo tee _ib_manifest/manifest.json >/dev/null
          sudo chown "$(id -u):$(id -g)" _ib_manifest/manifest.json
          # Small JSON; dump the container/storage-related stage and source
          # entries outright - the full pipeline order is what matters here.
          jq -c '.sources // empty' _ib_manifest/manifest.json || true
          jq -c '.pipelines[]? | select(.stages[]? | .type | test("skopeo|containers\\.|container\\.|squashfs|deploy")) | {name, stages: [.stages[] | select(.type | test("skopeo|containers\\.|container\\.|squashfs|deploy")) | {type, options, inputs}]}' _ib_manifest/manifest.json || true
          rm -rf _ib_manifest

      - name: Build ISO with image-builder
        id: build
        run: |
          set -euxo pipefail
          BASE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          # image-builder resolves --bootc-ref from the calling user's
          # container storage, so share root's store with the CLI. The
          # offline payload is embedded natively with
          # --bootc-installer-payload-ref, which copies that reference from
          # the same host storage into the ISO squashfs; the kickstart's
          # --source-imgref must equal it exactly or Anaconda silently
          # falls back to a network pull (the Verify step below asserts
          # both on the finished ISO).
          sudo podman pull "${BASE_IMAGE}"
          mkdir -p _ib_output
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${PWD}/_ib_output:/output:z" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            build \
            --output-dir /output \
            --bootc-default-fs btrfs \
            --bootc-ref "localhost/${IMAGE_NAME}-iso:${DEFAULT_TAG}" \
            --bootc-installer-payload-ref "${BASE_IMAGE}" \
            generic-iso
          # Debug: the ISO's squashfs store contains the payload's overlay
          # layer dirs but no image records at all (no db.sql, no
          # overlay-images/). Check whether the skopeo stage's
          # containers-storage destination wrote the metadata into the
          # RUNNER's host store instead of the tree, and what storage
          # configuration the CLI container uses.
          echo "::group::host container storage census"
          sudo ls -la /var/lib/containers/storage/ | head -20
          sudo ls /var/lib/containers/storage/overlay-images/ 2>/dev/null | head -5
          sudo test -f /var/lib/containers/storage/db.sql && sudo grep -a -c "${BASE_IMAGE}" /var/lib/containers/storage/db.sql || echo "no db.sql on host"
          sudo podman images --format '{{.Reference}}' | head -10
          echo "::endgroup::"
          echo "::group::image-builder container storage config"
          sudo podman run --rm --pull=newer \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            bash -c 'cat /etc/containers/storage.conf 2>/dev/null | grep -v "^#" | grep -v "^$" | head -20; echo ---; cat /usr/lib/containers/storage.conf 2>/dev/null | head -10; echo ---; rpm -q containers-common podman skopeo 2>/dev/null || true; cat /etc/os-release | head -3'
          echo "::endgroup::"
          mapfile -t isos < <(find _ib_output -maxdepth 2 -name '*.iso')
          if [ "${#isos[@]}" -ne 1 ]; then
            echo "error: expected exactly one ISO, got: ${isos[*]:-none}" >&2
            exit 1
          fi
          # Hand the ISO to the checksum/upload steps outside the workspace.
          mv -f "${isos[0]}" "${RUNNER_TEMP}/pixel-blue.iso"
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/pixel-blue.iso"
          rm -rf _ib_output
          echo "iso-dest=${RUNNER_TEMP}/pixel-blue.iso" >> "$GITHUB_OUTPUT"
          echo "payload-ref=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Verify offline payload
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
          PAYLOAD_REF: ${{ steps.build.outputs.payload-ref }}
        run: |
          set -euxo pipefail
          sudo bash ./build_files/iso/verify-iso-offline.sh "${ISO_PATH}" "${PAYLOAD_REF}"

      - name: Name and checksum ISO
        id: checksum
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          set -euo pipefail
          iso_dir="$(dirname "$ISO_PATH")"
          iso_name="$(basename "$ISO_PATH")"
          (cd "$iso_dir" && sha256sum "$iso_name" | tee "${iso_name}-CHECKSUM")
          echo "iso-path=${ISO_PATH}" >> "$GITHUB_OUTPUT"
          echo "checksum-path=${ISO_PATH}-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Upload ISO and Checksum to Job Artifacts
        if: inputs.upload-iso-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-iso
          path: |
            ${{ steps.checksum.outputs.iso-path }}
            ${{ steps.checksum.outputs.checksum-path }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload ISO to S3
        if: inputs.upload-iso-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          ISO_PATH: ${{ steps.checksum.outputs.iso-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          # Version comes from the payload image's OCI label, which build.yml
          # stamps with its own run number. Using THIS workflow's run_number
          # would diverge from the version reported by the installed system
          # (bootc status), so only fall back to it if the label is missing.
          VERSION="$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            | jq -r '.Labels["org.opencontainers.image.version"]')"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            VERSION="$(date -u +%Y%m%d).${{ github.run_number }}"
          fi
          VERSION_PATH="$(dirname "$ISO_PATH")/pixel-blue.iso.version"
          echo "$VERSION" > "$VERSION_PATH"
          # One rclone invocation for the whole directory (iso + checksum +
          # version), like the qcow2 job: with the default --transfers 4 the
          # small files go up concurrently with the ISO, avoiding a lone
          # request right after the bulk multipart upload that the endpoint
          # answers with 403/501. --include keeps other runner.temp junk out.
          rclone copy "$(dirname "$ISO_PATH")" S3:${{ vars.S3_BUCKET_NAME }} \
            --include "pixel-blue.iso" \
            --include "pixel-blue.iso-CHECKSUM" \
            --include "pixel-blue.iso.version"
