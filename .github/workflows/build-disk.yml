---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-qcow2-to-s3:
        description: "Upload the qcow2 image to S3"
        required: false
        default: false
        type: boolean
      upload-iso-to-s3:
        description: "Upload the Anaconda ISO to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/install_branding.tmpl'
      - 'flatpak_refs/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # qcow2 disk image, built with bootc-image-builder (amd64)
  build-qcow2:
    name: Build qcow2
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build qcow2
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/disk.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True
          rootfs: btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-qcow2-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true


      - name: Upload qcow2 to S3
        if: inputs.upload-qcow2-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ vars.S3_BUCKET_NAME }}

  # Anaconda install ISO, built with jasonn3/build-container-installer.
  # The ISO installs the container image from an embedded OCI repo (offline),
  # deploys the Flatpak apps from flatpak_refs/ to /var/lib/flatpak, and
  # re-points the installation at the registry (bootc switch) afterwards.
  # variant=Silverblue selects Anaconda's fedora-silverblue profile: the
  # installer only asks for the destination, and account/timezone setup
  # happens in gnome-initial-setup on first boot, like the official Fedora ISO.
  build-iso:
    name: Build anaconda ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Transcode image layers to gzip for umoci
        run: |
          set -euo pipefail
          # build.yml publishes the GHCR layers as zstd (#65), but this ISO
          # build unpacks the image with umoci, which only understands tar
          # and tar+gzip blobs and aborts on the OCI tar+zstd mediatype.
          # Re-publish the image into a local OCI store recompressed to gzip
          # and pass it to the action via image_src (the action's host-side
          # Flatpak dependency step unpacks the same image with umoci too).
          # /github/workspace is where the action bind-mounts the workspace,
          # so symlink it on the host as well and keep the store inside the
          # workspace: the same absolute path then resolves both on the host
          # and inside the action container.
          sudo mkdir -p /github
          sudo ln -sfn "$GITHUB_WORKSPACE" /github/workspace
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo copy --dest-compress --dest-compress-format gzip \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            "oci:/github/workspace/image-gzip:${DEFAULT_TAG}"

      - name: Resolve Fedora version
        id: version
        run: |
          set -euo pipefail
          # jasonn3 needs the Fedora version of the installer environment.
          # Read it from the version label of the base image (e.g.
          # "44.20261019.0" -> "44") so it tracks the base image instead of
          # being pinned by hand. Skopeo picks up the labels our build's
          # final rechunked image may have lost.
          FEDORA_VERSION=$(skopeo inspect --override-arch amd64 \
            docker://quay.io/fedora/fedora-silverblue:latest \
            | jq -r '.Labels["org.opencontainers.image.version"]' | cut -d. -f1)
          if [ -z "${FEDORA_VERSION}" ]; then
            echo "::error::Could not resolve Fedora version from the base image label"
            exit 1
          fi
          echo "FEDORA_VERSION=${FEDORA_VERSION}" >> "${GITHUB_ENV}"
          echo "Installer Fedora version: ${FEDORA_VERSION}"

      - name: Build anaconda ISO
        id: build
        uses: jasonn3/build-container-installer@1c2afd1bde337ae07a1ce0a7edbda729d3e4d55c # main (2026-09-25)
        with:
          arch: x86_64
          image_name: ${{ env.IMAGE_NAME }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_tag: ${{ env.DEFAULT_TAG }}
          # gzip-recompressed copy of the registry image (see transcode step)
          image_src: oci:/github/workspace/image-gzip:${{ env.DEFAULT_TAG }}
          version: ${{ env.FEDORA_VERSION }}
          variant: Silverblue
          iso_name: build/pixel-blue.iso
          # Lorax template run inside the installer environment build
          # (issue #56): rebrands os-release and .buildstamp to "Pixel
          # Blue". The action passes it verbatim to lorax --add-template,
          # so it must be the path of the repo file inside its container,
          # where the workspace is mounted at /github/workspace. Keep in
          # sync with the just build-iso recipe.
          additional_templates: /github/workspace/disk_config/install_branding.tmpl
          # Default Flatpak applications, one ref per file in flatpak_refs/.
          # Pulled from Flathub at build time and embedded in the ISO.
          flatpak_remote_name: flathub
          flatpak_remote_url: https://flathub.org/repo/flathub.flatpakrepo
          flatpak_remote_refs_dir: flatpak_refs

      - name: Upload ISO and Checksum to Job Artifacts
        if: inputs.upload-iso-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-iso
          path: ${{ steps.build.outputs.iso_path }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload ISO to S3
        if: inputs.upload-iso-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.iso_path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ vars.S3_BUCKET_NAME }}
