---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-qcow2-to-s3:
        description: "Upload the qcow2 image to S3"
        required: false
        default: false
        type: boolean
      upload-iso-to-s3:
        description: "Upload the install ISO to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - testing
    paths:
      - 'Containerfile.installer'
      - 'build_files/installer/**'
      - 'disk_config/disk.toml'
      - 'flatpak_refs/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  IMAGE_BUILDER_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # qcow2 disk image, built with bootc-image-builder (amd64)
  build-qcow2:
    name: Build qcow2
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build qcow2
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/disk.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True
          rootfs: btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-qcow2-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true


      - name: Upload qcow2 to S3
        if: inputs.upload-qcow2-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ vars.S3_BUCKET_NAME }}

  # Install ISO, built with osbuild image-builder (bootc-generic-iso).
  # The ISO boots the Anaconda Web UI installer; it installs the published image
  # from a containers-storage copy embedded in the ISO and the Flatpaks from
  # flatpak_refs/ out of the local ostree repo baked into the installer image.
  # Both happen before the first boot and neither needs a network. There is no
  # live desktop -- this is an installer, not a live session.
  #
  # The install is interactive: no kickstart is passed, so Anaconda shows the
  # Installation Destination page (pick disk, keep Automatic) and the payload
  # plus the graphical default target come from interactive-defaults.ks. The
  # kernel command line that selects the GUI lives in
  # build_files/installer/iso.yaml, not in image-builder.
  build-iso:
    name: Build install ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          # The payload ends up in the ISO under a local reference (the pull
          # step re-tags it there to shed the cosign signature attachments),
          # while the installed system tracks the published one for updates.
          {
            echo "PAYLOAD_SRC_REF=localhost/${IMAGE_NAME,,}-payload:${DEFAULT_TAG}"
            echo "PAYLOAD_TARGET_REF=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}"
          } >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build installer image
        run: |
          set -euxo pipefail
          # Flatpak runs inside this build, so bwrap needs sys_admin and
          # unconfined labels. The payload references are baked into
          # interactive-defaults.ks, so they must match what
          # --bootc-installer-payload-ref and the pull step produced.
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg PAYLOAD_SRC_REF="${PAYLOAD_SRC_REF}" \
            --build-arg PAYLOAD_TARGET_REF="${PAYLOAD_TARGET_REF}" \
            --tag "localhost/${IMAGE_NAME}-installer:${DEFAULT_TAG}" \
            --file Containerfile.installer .

      # Informational, not a gate: it prints what the installer image actually
      # contains, so a UI that fails to come up in a VM can be diagnosed from
      # the job log instead of a second 30-minute build. The local display path
      # for the Web UI is the fragile part -- it needs a browser/WebView plus
      # something to open it on, and nothing here proves that chain works.
      - name: Inspect installer UI plumbing
        run: |
          set -uo pipefail
          img="localhost/${IMAGE_NAME}-installer:${DEFAULT_TAG}"
          script='
            echo "--- UI packages ---"
            rpm -q anaconda-webui anaconda-gui slitherer webkit2gtk4.1 firefox cockpit-ws 2>&1 || true
            echo "--- launcher ---"
            ls -l /usr/libexec/anaconda/webui-desktop 2>&1 || true
            echo "--- default browser command ---"
            grep -n "DEFAULT_BROWSER_CMD" /usr/libexec/anaconda/webui-desktop 2>&1 || true
            echo "--- units ---"
            ls /usr/lib/systemd/system/ 2>/dev/null | grep -i anaconda || true
            echo "--- interactive defaults ---"
            cat /usr/share/anaconda/interactive-defaults.ks 2>&1 || true
          '
          sudo podman run --rm --entrypoint /bin/sh "${img}" -c "${script}" \
            | tee "${RUNNER_TEMP}/installer-ui.txt"
          {
            echo "<details><summary>Installer UI plumbing</summary>"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/installer-ui.txt"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull install payload into rootful storage
        run: |
          set -euxo pipefail
          # image-builder copies the payload out of the host's container
          # storage -- it never contacts a registry -- so the payload has to
          # be there before the ISO is assembled. Installing this repo's
          # policy first makes the pull verify the cosign signature, exactly
          # like a client would.
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          sudo install -Dm644 system_files/etc/pki/containers/pixel-blue.pub /etc/pki/containers/pixel-blue.pub
          sudo install -Dm644 system_files/etc/containers/policy.json /etc/containers/policy.json
          sudo install -Dm644 system_files/etc/containers/registries.d/pixel-blue.yaml /etc/containers/registries.d/pixel-blue.yaml
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"

          # Re-tag the payload to a local reference, dropping the signature
          # attachments on the way.
          #
          # registries.d/pixel-blue.yaml sets use-sigstore-attachments, so the
          # pull above stored the cosign signature next to the image. When
          # image-builder copies that image into the ISO's container storage,
          # skopeo refuses:
          #
          #   Copying this image would require changing layer representation,
          #   which we cannot do: "Would invalidate signatures"
          #
          # that copy has to re-encode the layers, and containers/image will
          # not do that to an image whose signatures are present because the
          # result would no longer match them. The pull above already verified
          # them, so they have served their purpose.
          #
          # Copying to a local reference (rather than stripping signatures in
          # place) also pins the name the installer sees, so
          # interactive-defaults.ks never has to guess how the payload ended up
          # being stored.
          payload_src="${PAYLOAD_SRC_REF}"
          sudo skopeo copy --remove-signatures \
            "containers-storage:${PAYLOAD_TARGET_REF}" \
            "containers-storage:${payload_src}"

      - name: Build ISO with image-builder
        id: build
        run: |
          set -euxo pipefail
          out="${RUNNER_TEMP}/iso-out"
          mkdir -p "${out}"
          # Fedora bootc containers do not declare a root filesystem and
          # image-builder refuses to guess one, so pass the same btrfs default
          # the qcow2/raw images use.
          sudo podman run --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${out}":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            build \
            --output-dir /output \
            --bootc-ref "localhost/${IMAGE_NAME}-installer:${DEFAULT_TAG}" \
            --bootc-installer-payload-ref "${PAYLOAD_SRC_REF}" \
            --bootc-default-fs btrfs \
            --progress verbose \
            bootc-generic-iso

          # The builder is referenced by tag, so behaviour can change under us.
          # Print the digest that actually produced this ISO: that is the value
          # to pin IMAGE_BUILDER_IMAGE to once the pipeline is proven.
          sudo podman image inspect --format 'image-builder digest: {{.Digest}}' \
            "${IMAGE_BUILDER_IMAGE}" || true

          # The layout under --output-dir is image-builder's business (it
          # nests by name/type/arch), so find the ISO instead of guessing.
          iso="$(find "${out}" -type f -name '*.iso' | head -n1)"
          if [[ -z "${iso}" ]]; then
            echo "::error::image-builder produced no ISO under ${out}"
            exit 1
          fi
          echo "iso-path=${iso}" >> "$GITHUB_OUTPUT"

      # The whole point of moving off the bootc-installer type is the kernel
      # command line, and that is cheap to check straight out of the ISO. A
      # silent regression here means shipping a TUI installer again, so fail
      # the build rather than the user.
      - name: Verify installer mode from grub.cfg
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-path }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso

          work="${RUNNER_TEMP}/iso-inspect"
          rm -rf "${work}"; mkdir -p "${work}"
          for candidate in /boot/grub2/grub.cfg /EFI/BOOT/grub.cfg; do
            if xorriso -osirrox on -indev "${ISO_PATH}" \
                 -extract "${candidate}" "${work}/grub.cfg" >/dev/null 2>&1; then
              echo "extracted ${candidate}"
              break
            fi
          done
          if [[ ! -f "${work}/grub.cfg" ]]; then
            echo "::error::could not find grub.cfg on the ISO"
            exit 1
          fi

          cmdlines="$(grep -o 'linuxefi\? .*' "${work}/grub.cfg" || true)"
          echo "--- kernel command lines ---"
          echo "${cmdlines}"
          echo "----------------------------"
          {
            echo "### Installer kernel command lines"
            echo '```'
            echo "${cmdlines:-（none）}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! grep -q 'inst\.graphical' "${work}/grub.cfg"; then
            echo "::error::inst.graphical missing -- the installer would start in text mode"
            exit 1
          fi
          if grep -q 'inst\.text' "${work}/grub.cfg"; then
            echo "::error::inst.text present -- the installer would run as a TUI"
            exit 1
          fi
          if ! grep -q 'inst\.stage2=hd:LABEL=Pixel-Blue-Installer' "${work}/grub.cfg"; then
            echo "::error::inst.stage2 does not match the label in build_files/installer/iso.yaml"
            exit 1
          fi
          echo "installer mode OK: graphical, no inst.text, stage2 label matches"

      - name: Name and checksum ISO
        id: checksum
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-path }}
        run: |
          set -euo pipefail
          # Move the ISO out of image-builder's output tree into a flat dir,
          # so the upload steps below and the S3 version file share one
          # predictable location.
          dist="${RUNNER_TEMP}/dist"
          mkdir -p "${dist}"
          mv "${ISO_PATH}" "${dist}/pixel-blue.iso"
          (cd "${dist}" && sha256sum pixel-blue.iso | tee pixel-blue.iso-CHECKSUM)
          echo "iso-path=${dist}/pixel-blue.iso" >> "$GITHUB_OUTPUT"
          echo "checksum-path=${dist}/pixel-blue.iso-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Upload ISO and Checksum to Job Artifacts
        if: inputs.upload-iso-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-iso
          path: |
            ${{ steps.checksum.outputs.iso-path }}
            ${{ steps.checksum.outputs.checksum-path }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload ISO to S3
        if: inputs.upload-iso-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          ISO_PATH: ${{ steps.checksum.outputs.iso-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          # Version comes from the payload image's OCI label, which build.yml
          # stamps with its own run number. Using THIS workflow's run_number
          # would diverge from the version reported by the installed system
          # (bootc status), so only fall back to it if the label is missing.
          VERSION="$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            | jq -r '.Labels["org.opencontainers.image.version"]')"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            VERSION="$(date -u +%Y%m%d).${{ github.run_number }}"
          fi
          VERSION_PATH="$(dirname "$ISO_PATH")/pixel-blue.iso.version"
          echo "$VERSION" > "$VERSION_PATH"
          # One rclone invocation for the whole directory (iso + checksum +
          # version), like the qcow2 job: with the default --transfers 4 the
          # small files go up concurrently with the ISO, avoiding a lone
          # request right after the bulk multipart upload that the endpoint
          # answers with 403/501. --include keeps other runner.temp junk out.
          rclone copy "$(dirname "$ISO_PATH")" S3:${{ vars.S3_BUCKET_NAME }} \
            --include "pixel-blue.iso" \
            --include "pixel-blue.iso-CHECKSUM" \
            --include "pixel-blue.iso.version"
