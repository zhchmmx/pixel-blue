---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-qcow2-to-s3:
        description: "Upload the qcow2 image to S3"
        required: false
        default: false
        type: boolean
      upload-iso-to-s3:
        description: "Upload the Anaconda ISO to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - testing
    paths:
      - 'Containerfile.iso'
      - 'build_files/iso/**'
      - 'disk_config/disk.toml'
      - 'flatpak_refs/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # qcow2 disk image, built with bootc-image-builder (amd64)
  build-qcow2:
    name: Build qcow2
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build qcow2
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/disk.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True
          rootfs: btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-qcow2-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true


      - name: Upload qcow2 to S3
        if: inputs.upload-qcow2-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ vars.S3_BUCKET_NAME }}

  # Live install ISO, built with ublue-os/titanoboa (issue #77).
  # The ISO boots a GNOME live session; Anaconda installs the container image
  # from a containers-storage copy embedded in the ISO (offline), copies the
  # Flatpak apps from flatpak_refs/ into the target and repoints the installed
  # deployment at the signed GHCR image. The live/installer environment is a
  # second image built from Containerfile.iso and is never pushed.
  build-iso:
    name: Build live ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build live ISO layer
        run: |
          set -euxo pipefail
          BASE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          # The layer's build pulls the installer payload into its own
          # container storage and installs Flatpaks, so the nested podman
          # needs the extra capabilities and unconfined labels.
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg PAYLOAD_IMAGE="${BASE_IMAGE}" \
            --tag "localhost/${IMAGE_NAME}-iso:${DEFAULT_TAG}" \
            --file Containerfile.iso .

      - name: Build ISO with titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main (2026-06-18)
        with:
          image-ref: localhost/${{ env.IMAGE_NAME }}-iso:${{ env.DEFAULT_TAG }}
          # titanoboa resolves a relative iso-dest against its own action
          # directory, so hand it an absolute path outside the workspace.
          iso-dest: ${{ runner.temp }}/pixel-blue.iso

      - name: Name and checksum ISO
        id: checksum
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          set -euo pipefail
          iso_dir="$(dirname "$ISO_PATH")"
          iso_name="$(basename "$ISO_PATH")"
          (cd "$iso_dir" && sha256sum "$iso_name" | tee "${iso_name}-CHECKSUM")
          echo "iso-path=${ISO_PATH}" >> "$GITHUB_OUTPUT"
          echo "checksum-path=${ISO_PATH}-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Upload ISO and Checksum to Job Artifacts
        if: inputs.upload-iso-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-iso
          path: |
            ${{ steps.checksum.outputs.iso-path }}
            ${{ steps.checksum.outputs.checksum-path }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload ISO to S3
        if: inputs.upload-iso-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          ISO_PATH: ${{ steps.checksum.outputs.iso-path }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.checksum-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          # Version comes from the payload image's OCI label, which build.yml
          # stamps with its own run number. Using THIS workflow's run_number
          # would diverge from the version reported by the installed system
          # (bootc status), so only fall back to it if the label is missing.
          VERSION="$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            | jq -r '.Labels["org.opencontainers.image.version"]')"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            VERSION="$(date -u +%Y%m%d).${{ github.run_number }}"
          fi
          VERSION_PATH="$(dirname "$ISO_PATH")/pixel-blue.iso.version"
          echo "$VERSION" > "$VERSION_PATH"
          rclone copy "$VERSION_PATH" S3:${{ vars.S3_BUCKET_NAME }}
          rclone copy "$ISO_PATH" S3:${{ vars.S3_BUCKET_NAME }}
          rclone copy "$CHECKSUM_PATH" S3:${{ vars.S3_BUCKET_NAME }}
          rclone copy "$VERSION_PATH" S3:${{ vars.S3_BUCKET_NAME }}
