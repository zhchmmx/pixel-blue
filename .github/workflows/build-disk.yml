---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-qcow2-to-s3:
        description: "Upload the qcow2 image to S3"
        required: false
        default: false
        type: boolean
      upload-iso-to-s3:
        description: "Upload the install ISO to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - testing
    paths:
      - 'Containerfile.installer'
      - 'build_files/installer/**'
      - 'disk_config/disk.toml'
      - 'flatpak_refs/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  IMAGE_BUILDER_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # qcow2 disk image, built with bootc-image-builder (amd64)
  build-qcow2:
    name: Build qcow2
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build qcow2
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/disk.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True
          rootfs: btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-qcow2-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true


      - name: Upload qcow2 to S3
        if: inputs.upload-qcow2-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ vars.S3_BUCKET_NAME }}

  # Install ISO, built with osbuild image-builder (bootc-installer).
  # The ISO boots Anaconda; it installs the published image from a
  # containers-storage copy embedded in the ISO and the Flatpaks from
  # flatpak_refs/ out of the local ostree repo baked into the installer image.
  # Both happen before the first boot and need no network. There is no live
  # desktop -- this is an installer, not a live session.
  build-iso:
    name: Build install ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build installer image
        run: |
          set -euxo pipefail
          # Flatpak runs inside this build, so bwrap needs sys_admin and
          # unconfined labels.
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --tag "localhost/${IMAGE_NAME}-installer:${DEFAULT_TAG}" \
            --file Containerfile.installer .

      - name: Pull install payload into rootful storage
        run: |
          set -euxo pipefail
          # image-builder copies the payload out of the host's container
          # storage -- it never contacts a registry -- so the payload has to
          # be there before the ISO is assembled. Installing this repo's
          # policy first makes the pull verify the cosign signature, exactly
          # like a client would.
          sudo install -Dm644 system_files/etc/pki/containers/pixel-blue.pub /etc/pki/containers/pixel-blue.pub
          sudo install -Dm644 system_files/etc/containers/policy.json /etc/containers/policy.json
          sudo install -Dm644 system_files/etc/containers/registries.d/pixel-blue.yaml /etc/containers/registries.d/pixel-blue.yaml
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Build ISO with image-builder
        id: build
        run: |
          set -euxo pipefail
          out="${RUNNER_TEMP}/iso-out"
          mkdir -p "${out}"
          # Fedora bootc containers do not declare a root filesystem and
          # image-builder refuses to guess one, so pass the same ext4 default
          # bootc-image-builder uses for the qcow2/raw images.
          sudo podman run --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${out}":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${IMAGE_BUILDER_IMAGE}" \
            build \
            --output-dir /output \
            --bootc-ref "localhost/${IMAGE_NAME}-installer:${DEFAULT_TAG}" \
            --bootc-installer-payload-ref "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --bootc-default-fs btrfs \
            --progress verbose \
            bootc-installer

          # The layout under --output-dir is image-builder's business (it
          # nests by name/type/arch), so find the ISO instead of guessing.
          iso="$(find "${out}" -type f -name '*.iso' | head -n1)"
          if [[ -z "${iso}" ]]; then
            echo "::error::image-builder produced no ISO under ${out}"
            exit 1
          fi
          echo "iso-path=${iso}" >> "$GITHUB_OUTPUT"

      - name: Name and checksum ISO
        id: checksum
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-path }}
        run: |
          set -euo pipefail
          # Move the ISO out of image-builder's output tree into a flat dir,
          # so the upload steps below and the S3 version file share one
          # predictable location.
          dist="${RUNNER_TEMP}/dist"
          mkdir -p "${dist}"
          mv "${ISO_PATH}" "${dist}/pixel-blue.iso"
          (cd "${dist}" && sha256sum pixel-blue.iso | tee pixel-blue.iso-CHECKSUM)
          echo "iso-path=${dist}/pixel-blue.iso" >> "$GITHUB_OUTPUT"
          echo "checksum-path=${dist}/pixel-blue.iso-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Upload ISO and Checksum to Job Artifacts
        if: inputs.upload-iso-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-blue-iso
          path: |
            ${{ steps.checksum.outputs.iso-path }}
            ${{ steps.checksum.outputs.checksum-path }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload ISO to S3
        if: inputs.upload-iso-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          # Credentials come from Secrets; the rest from Variables.
          RCLONE_CONFIG_S3_PROVIDER: ${{ vars.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ vars.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          ISO_PATH: ${{ steps.checksum.outputs.iso-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          # Version comes from the payload image's OCI label, which build.yml
          # stamps with its own run number. Using THIS workflow's run_number
          # would diverge from the version reported by the installed system
          # (bootc status), so only fall back to it if the label is missing.
          VERSION="$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" \
            | jq -r '.Labels["org.opencontainers.image.version"]')"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            VERSION="$(date -u +%Y%m%d).${{ github.run_number }}"
          fi
          VERSION_PATH="$(dirname "$ISO_PATH")/pixel-blue.iso.version"
          echo "$VERSION" > "$VERSION_PATH"
          # One rclone invocation for the whole directory (iso + checksum +
          # version), like the qcow2 job: with the default --transfers 4 the
          # small files go up concurrently with the ISO, avoiding a lone
          # request right after the bulk multipart upload that the endpoint
          # answers with 403/501. --include keeps other runner.temp junk out.
          rclone copy "$(dirname "$ISO_PATH")" S3:${{ vars.S3_BUCKET_NAME }} \
            --include "pixel-blue.iso" \
            --include "pixel-blue.iso-CHECKSUM" \
            --include "pixel-blue.iso.version"
