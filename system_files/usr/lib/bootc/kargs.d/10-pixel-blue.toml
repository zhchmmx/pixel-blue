# Kernel arguments every Pixel Blue install boots with.
#
# bootc applies /usr/lib/bootc/kargs.d at install time and again on upgrades,
# and it is the only channel that reaches the installed system deterministically.
#
# The installer's own kernel command line does get inherited into the target by
# bootc's install completion (reconcile_kargs), but that inheritance is lossy in
# exactly the wrong way: a real install came out with the installer's console=
# and selinux=0 carried over and rhgb/quiet missing, i.e. plymouthd running in
# text mode and no boot animation at all. Adding the two arguments here is what
# Fedora's own desktop images do, and it does not depend on the installer's
# command line at all.
#
# rhgb makes plymouth draw the graphical splash; quiet keeps kernel messages
# from painting over it.
kargs = ["rhgb", "quiet"]
