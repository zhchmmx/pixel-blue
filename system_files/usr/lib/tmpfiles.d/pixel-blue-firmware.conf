# MrChromebox Full ROM state used by the fwupd plugin and the weekly check.
#
# The cab/ directory has to exist before fwupd starts: a file:// remote whose
# path is a directory is the only kind whose contents fwupd watches, and fwupd
# decides the kind once at daemon startup. If the directory were missing then,
# it would be parsed as a single metadata file and cabinets dropped in later
# would never be noticed until the next reboot.
#
# cab/ sits under fwupd's StateDirectory so `fwupdmgr clean` (which recurses
# into the parent of a directory remote) can only ever delete cabinets, never
# backup.rom.
d /var/lib/pixel-blue/firmware 0755 root root -
d /var/lib/pixel-blue/firmware/cache 0755 root root -
d /var/lib/fwupd/pixel-blue 0755 root root -
d /var/lib/fwupd/pixel-blue/cab 0755 root root -
