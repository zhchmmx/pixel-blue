# Pixelbook (eve) ambient-light brightness steps.
#
# Extracted from ChromeOS /usr/share/power_manager/internal_backlight_als_steps
# (power_manager "internal_backlight_als_steps" pref, 7-level eve table).
#
# Columns: ui_percent  brightness_percent  down_lux  up_lux
#
#   ui_percent        user-visible brightness percentage decided by the step
#   brightness_percent percentage fed to the brightness curve; identical to
#                      ui_percent on eve (kept as a separate column because
#                      other boards differ)
#   down_lux          step down when ambient light drops below this value
#   up_lux            step up when ambient light rises above this value
#
# A value of -1 means "no transition in that direction": the first row has no
# down threshold and the last row has no up threshold. The overlapping ranges
# (40-90, 180-250, 250-360, 350-500, 1100-1700, 5250-6750) are the hysteresis
# bands that keep the brightness from flapping around a single lux value.
#
# These are UI percentages, not hardware levels. The daemon applies ChromeOS'
# square curve (see power_manager/docs/screen_brightness.md):
#
#   fraction = (percent - 6.25) / (100 - 6.25)
#   level    = min_visible + fraction^2 * (max - min_visible)
#
# To override on a running system, put a file with the same format at
# /etc/pixel-blue/als-steps.conf; it takes precedence over this one.

36.14 36.14 -1 90
47.62 47.62 40 250
60.57 60.57 180 360
71.65 71.65 250 500
85.83 85.83 350 1700
93.27 93.27 1100 6750
100.0 100.0 5250 -1
