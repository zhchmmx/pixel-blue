<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may provide the firmware service. -->
  <policy user="root">
    <allow own="tech.pixelblue.Firmware1"/>
    <allow send_destination="tech.pixelblue.Firmware1"/>
    <allow send_type="signal"/>
  </policy>

  <!-- Any local user may read status and ask for a check; the privileged
       methods are gated by polkit inside the daemon. -->
  <policy context="default">
    <allow send_destination="tech.pixelblue.Firmware1"/>
    <allow receive_sender="tech.pixelblue.Firmware1"/>
  </policy>
</busconfig>
