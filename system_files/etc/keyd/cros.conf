[ids]
# Pixelbook and Pixelbook Go use AT Keyboard (0001:0001)
0001:0001

# NOTE: keyd only honours full-line comments (first non-space character is '#').
# Do not append trailing comments to bindings; keyd parses them as part of the
# value and silently drops the binding (keyd check then fails).

[main]
# The eve top row is assumed to emit media codes (back, refresh, zoom, scale,
# brightnessdown/brightnessup, playpause, mute, volumedown/volumeup); confirm
# with `keyd monitor` (README caveat). Only these two keys are remapped.
# Fullscreen is deliberately NOT remapped. The key emits KEY_FULL_SCREEN (372),
# which keyd forwards (src/device.c translates it to keyd's internal code and
# src/vkbd/uinput.c registers and re-emits it). xkeyboard-config turns it into
# the XF86FullScreen keysym, and zz0-pixel-blue-modifications.gschema.override
# binds that keysym to GNOME's toggle-fullscreen.
# Overview key -> screenshot UI (GNOME hangs the screenshot UI off Print).
scale = print
# Three-lines menu key -> Quick Settings (GNOME 45+ native Super+S). The key
# natively emits KEY_CONTROLPANEL (0x243), which keyd's input translation does
# not cover (src/device.c drops codes it has no mapping for), so the udev hwdb
# (70-pixel-keyboard.hwdb) maps it to KEY_DASHBOARD first.
dashboard = M-s
# Modifier->layer bindings are implicit in keyd; declared here for clarity.
meta = layer(meta)
control = layer(control)
leftalt = layer(alt)
# Right Alt is intentionally NOT remapped: keyd's default is
# rightalt = layer(altgr), which emits RIGHTALT (not LEFTALT). The
# [altgr] layer below mirrors [alt] so right-Alt combos (Alt+Backspace,
# Alt+brightness, etc.) behave identically to left-Alt ones.
shift = layer(shift)

[meta]
# Hold Search (Meta): top row = F1-F10 (official), plus ChromeOS navigation.
# Bindings here drop Super, so outputs are plain keys or explicit-modifier
# macros (M- = Super, C- = Ctrl, S- = Shift, A- = Alt).
back = f1
refresh = f2
zoom = f3
scale = f4
brightnessdown = f5
brightnessup = f6
playpause = f7
mute = f8
volumedown = f9
volumeup = f10
dashboard = f12
# Search + Alt -> Caps Lock (either order; the [alt] layer adds the other).
leftalt = capslock
# Search + Left/Right -> Home/End (bare, so it is not read as a Super combo).
left = home
right = end
# Search + [ / ] -> previous / next workspace (GNOME native Super+Page_Up/Down).
leftbrace = M-pageup
rightbrace = M-pagedown

[alt]
# Alt combos; output drops Alt (ChromeOS semantics).
leftmeta = capslock
backspace = delete
# Alt + Up/Down is deliberately NOT mapped: keyd sits below the app layer, so
# binding it to Page Up/Down would hijack GNOME Files' parent-folder shortcut
# (Alt+Up) and editors' move-line bindings (Alt+Up/Down). See README "Alt held".
brightnessdown = kbdillumdown
brightnessup = kbdillumup

# [altgr] mirrors [alt] (keyd's default rightalt=layer(altgr) is left untouched;
# only the layer contents are duplicated).
[altgr]
leftmeta = capslock
backspace = delete
brightnessdown = kbdillumdown
brightnessup = kbdillumup

# Composite layers must be declared after their constituent layers.
[shift+meta]
# Search + Shift + Left/Right -> select to line start / end.
left = S-home
right = S-end
# Search + Shift + [ / ] -> move window to previous / next workspace.
leftbrace = M-S-pageup
rightbrace = M-S-pagedown

[control+meta]
# Search + Ctrl + Left/Right -> start / end of document.
left = C-home
right = C-end

[control+alt]
backspace = C-A-delete

[control+altgr]
backspace = C-A-delete
