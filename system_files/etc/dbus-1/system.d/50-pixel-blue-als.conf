<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!--
    Keep the ambient light sensor published by iio-sensor-proxy so that
    GNOME Settings still shows the "Automatic Brightness" switch
    (its visibility depends on net.hadess.SensorProxy.HasAmbientLight).

    als-brightness-daemon.py reads the sensor from IIO sysfs and is the only
    process allowed to drive the backlight from ambient light. Without this
    rule gnome-settings-daemon would also claim the sensor and fight the
    daemon for the backlight.

    iio-sensor-proxy starts polling only for clients that successfully
    claimed a sensor, so a denied ClaimLight also means gsd never receives
    LightLevel updates and never runs its own brightness curve.
  -->
  <policy context="default">
    <deny send_destination="net.hadess.SensorProxy"
          send_interface="net.hadess.SensorProxy"
          send_member="ClaimLight"/>
  </policy>

</busconfig>
