# rpm-ostree daemon configuration; options and defaults: rpm-ostreed.conf(5).
#
# Pixel Blue ships AutomaticUpdatePolicy=stage so the automatic trigger
# (rpm-ostreed-automatic.timer, enabled in build_files/build.sh) downloads
# and stages the next deployment on its own. GNOME Software's built-in
# rpm-ostree plugin — active on any ostree-booted system, so already in
# this Silverblue-based image — reads that staged deployment from the
# daemon over D-Bus and surfaces it as a "restart to update" system
# update; no third-party PackageKit backend is involved.
#
# LockLayering=true rejects runtime mutation of the base (rpm-ostree
# install/uninstall, overrides, client-side initramfs regeneration), so
# the base tree stays exactly what the OCI image ships and an auto-staged
# update can never fail on layered-package depsolve. Apps belong in
# Flathub, which the image pre-registers.
#
# bootc three-way-merges /etc on update, so a host that never edited this
# file picks up these values by itself. A host where someone did edit it
# keeps their copy; to adopt the image values there (clobbering the local
# edits), run once after updating:
#   sudo cp /usr/etc/rpm-ostreed.conf /etc/rpm-ostreed.conf && sudo rpm-ostree reload

[Daemon]
AutomaticUpdatePolicy=stage
LockLayering=true
#IdleExitTimeout=60
#Recommends=true
