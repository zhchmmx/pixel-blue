[Service]
# The mrchromebox plugin executes flashrom as a child process for the SPI
# internal programmer.  Upstream's sandbox blocks what it needs:
#   * SystemCallFilter lacks several calls flashrom makes;
#   * ProtectKernelTunables mounts /sys read-only;
#   * ProtectKernelModules blocks the rmmod spi_intel_platform the vendored
#     MrChromebox helpers run before probing (the kernel driver owns the bus);
#   * DeviceAllow= is a whitelist (DevicePolicy=closed), and upstream only
#     allowed /dev/mem while it still shipped its flashrom plugin;
#   * the vendored helpers write the flashrom transcript to /tmp/flashrom.log,
#     which has to outlive the service so a failed write can still be
#     classified afterwards.
# Reset those, keep everything else.
SystemCallFilter=
SystemCallErrorNumber=
ProtectKernelTunables=no
ProtectKernelModules=no
PrivateTmp=no
DeviceAllow=/dev/mem rw
