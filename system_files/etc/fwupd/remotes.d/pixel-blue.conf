[fwupd Remote]
# MrChromebox Full ROM releases published by firmware-update-check.sh as
# unsigned cabinets generated from the ROM pinned to the upstream .sha1.
# A file:// URI pointing at a directory makes this a "directory" remote:
# fwupd scans every .cab in it on refresh, no metadata.jcat needed.
Enabled=true
Title=Pixel Blue (MrChromebox)
MetadataURI=file:///var/lib/fwupd/pixel-blue/cab
ApprovalRequired=false
