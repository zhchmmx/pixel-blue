[fwupd Remote]
# MrChromebox Full ROM releases published by firmware-update-check.sh as
# unsigned cabinets generated from the ROM pinned to the upstream .sha1.
# A file:// URI pointing at a directory makes this a "directory" remote: fwupd
# scans every .cab in it and watches the directory for changes, no
# metadata.jcat needed. Releases from a directory remote are marked
# TRUSTED_PAYLOAD/TRUSTED_METADATA automatically (fu_release_ensure_trust_flags),
# so the shipped OnlyTrusted=true default stays untouched.
Enabled=true
Title=Pixel Blue (MrChromebox)
MetadataURI=file:///var/lib/fwupd/pixel-blue/cab
ApprovalRequired=false
